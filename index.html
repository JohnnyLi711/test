<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Site Under Maintenance</title>
    <meta name="robots" content="noindex" />
    <!-- Auto-refresh every 60 seconds to check status -->
    <meta http-equiv="refresh" content="60" />
    <style>
      :root { --bg:#f3f6fb; --card:#fff; --accent:#0366d6; --muted:#6b7280; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
      html,body{height:100%;margin:0}
      body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bg),#ffffff);color:#0f172a}
      .card{max-width:720px;padding:36px;border-radius:12px;background:var(--card);box-shadow:0 10px 30px rgba(2,6,23,0.08);text-align:center}
      h1{margin:0 0 8px;font-size:28px}
      p{margin:0 0 12px;color:var(--muted)}
      .meta{margin-top:16px;font-size:14px;color:var(--muted)}
      a{color:var(--accent);text-decoration:none}
      .cta{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:8px;background:var(--accent);color:white;font-weight:600;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <h1>We'll be back soon</h1>
      <p>Sorry for the inconvenience — the site is temporarily down for maintenance.</p>
    </main>
  </body>
</html>
